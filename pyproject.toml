[project]
name = "rag"
version = "0.1.0"
description = "Stitch — Enterprise Document Intelligence & Knowledge Retrieval Platform"
readme = "README.md"
authors = [
    { name = "Koppisetti Gnana Vishnu", email = "vishnugnana26@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
rag = "rag:main"
stitch-api = "rag.api:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
